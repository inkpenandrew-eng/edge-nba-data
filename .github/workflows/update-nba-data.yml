name: Update NBA Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NBA source data
        run: |
          mkdir -p source

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/playerlog_2025.parquet \
            -o source/playerlog_2025.parquet

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/gamelog_2025.parquet \
            -o source/gamelog_2025.parquet

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/team_summary_2025.json \
            -o source/team_summary_2025.json

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/playerlog_2026.parquet \
            -o source/playerlog_2026.parquet

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/gamelog_2026.parquet \
            -o source/gamelog_2026.parquet

          curl -L \
            https://raw.githubusercontent.com/llimllib/nba_data/main/data/team_summary_2026.json \
            -o source/team_summary_2026.json

      - name: Build EDGE NBA datasets
        run: |
          mkdir -p data
          python edge_nba_converter.py \
            --input source \
            --output data \
            --seasons 2025 2026

      - name: Commit updated NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No NBA data changes"
          else
            git commit -m "Update NBA data"
            git push
          fi
